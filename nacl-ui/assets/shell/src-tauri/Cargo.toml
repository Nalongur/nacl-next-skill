[package]
name = "nacl-next-s1-shell"
version = "0.1.0"
description = "Thin Tauri IPC shell over the NaCL Next SDK (S1)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ts-rs = { version = "11", optional = true, features = ["serde-json-impl"] }
nacl-next-sdk = { path = "../../../sdk/nacl-next-sdk" }

[lib]
name = "nacl_next_s1_shell"

[[bin]]
name = "nacl-next-s1-shell"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[features]
default = ["mode-b"]
# Exactly one project mode. A and D compile the Microsoft adapter; B never
# enables the dependency, the commands or any online request.
mode-a = ["microsoft"]
mode-b = []
mode-d = ["microsoft"]
microsoft = ["nacl-next-sdk/microsoft"]
contracts = ["dep:ts-rs", "nacl-next-sdk/contracts"]

[[example]]
name = "export_contracts"
required-features = ["contracts"]
